<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LedgerCore Distributed — Billetera Digital y Transferencias Seguras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        --bg-mint: #f4f7f6;
        --bg-card: #ffffff;
        --bg-soft: #ecf2ef;
        --pine-deep: #064e3b;
        --emerald-cta: #047857;
        --emerald-hover: #065f46;
        --ink-slate: #0f172a;
        --ink-muted: #475569;
        --border-pine: #d1ddd9;
        --amber-warn: #b45309;
        --amber-bg: #fef3c7;
        --ok-bg: #ecfdf5;
        --font-sans: "Albert Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-mint);
        color: var(--ink-slate);
        font-family: var(--font-sans);
        line-height: 1.5;
      }
      ::selection { background: #d1fae5; color: var(--pine-deep); }
      :focus-visible { outline: 2px solid var(--pine-deep); outline-offset: 2px; }
      button, input, select { font-family: inherit; }
      .lc-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

      .lc-header {
        background: var(--bg-card);
        border-bottom: 1px solid var(--border-pine);
        padding: 13px 24px;
      }
      .lc-header-inner {
        max-width: 1180px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .lc-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .lc-logo {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--pine-deep);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .lc-brand h1 { font-size: 19px; font-weight: 700; margin: 0; color: var(--pine-deep); }
      .lc-brand span { font-size: 13px; color: var(--ink-muted); }

      .lc-btn-primary {
        border: 1px solid var(--emerald-cta);
        background: var(--emerald-cta);
        color: #ffffff;
        border-radius: 8px;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .lc-btn-primary:hover { background: var(--emerald-hover); }
      .lc-btn-outline {
        border: 1px solid var(--border-pine);
        background: var(--bg-card);
        color: var(--ink-slate);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
      }
      .lc-btn-outline:hover { background: var(--bg-soft); }
      .lc-btn-warn {
        border: 1px solid #f59e0b;
        background: var(--amber-bg);
        color: var(--amber-warn);
        border-radius: 8px;
        padding: 8px 13px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .lc-main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 26px 24px 60px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
        gap: 24px;
        align-items: start;
      }

      .lc-card {
        background: var(--bg-card);
        border: 1px solid var(--border-pine);
        border-radius: 14px;
        padding: 22px;
      }
      .lc-balance-hero {
        background: var(--pine-deep);
        color: #ffffff;
        border-radius: 14px;
        padding: 24px;
        margin-bottom: 18px;
      }
      .lc-balance-label { font-size: 13px; opacity: 0.85; }
      .lc-balance-amount {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: clamp(2rem, 3.6vw, 2.75rem);
        font-weight: 600;
        margin: 6px 0 14px;
        letter-spacing: -0.02em;
      }
      .lc-account-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .lc-acc-pill {
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        border-radius: 9999px;
        padding: 5px 12px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .lc-acc-pill[data-active="true"] {
        background: #ffffff;
        color: var(--pine-deep);
        font-weight: 600;
      }

      .lc-field { margin-bottom: 14px; }
      .lc-field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-muted); margin-bottom: 6px; }
      .lc-input {
        width: 100%;
        border: 1px solid var(--border-pine);
        background: var(--bg-mint);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        color: var(--ink-slate);
      }

      .lc-demo-box {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border-pine);
      }
      .lc-demo-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 8px;
      }

      .lc-banner-feedback {
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 14px;
        font-size: 13.5px;
        display: none;
      }
      .lc-banner-feedback[data-tone="ok"] { display: block; background: var(--ok-bg); border: 1px solid #a7f3d0; color: var(--pine-deep); }
      .lc-banner-feedback[data-tone="warn"] { display: block; background: var(--amber-bg); border: 1px solid #fcd34d; color: var(--amber-warn); }

      .lc-tx-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
      .lc-tx-item {
        border: 1px solid var(--border-pine);
        background: var(--bg-mint);
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .lc-badge-ok { background: var(--ok-bg); color: var(--emerald-cta); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
      .lc-badge-rev { background: var(--amber-bg); color: var(--amber-warn); padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }

      /* Layer 2 Drawer */
      .lc-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.35);
        z-index: 40;
        display: none;
        justify-content: flex-end;
      }
      .lc-backdrop[data-open="true"] { display: flex; }
      .lc-drawer {
        width: min(470px, 100vw);
        height: 100%;
        background: var(--bg-card);
        border-left: 1px solid var(--border-pine);
        display: flex;
        flex-direction: column;
      }
      .lc-drawer-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-pine);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .lc-drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      @media (max-width: 860px) {
        .lc-main { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="lc-header">
      <div class="lc-header-inner">
        <div class="lc-brand">
          <span class="lc-logo">L</span>
          <div>
            <h1>LedgerCore Distributed</h1>
            <span>Billetera personal y transferencias protegidas contra fallos de red</span>
          </div>
        </div>
        <button type="button" class="lc-btn-outline" id="lc-arch-btn">Arquitectura</button>
      </div>
    </header>

    <main class="lc-main">
      <section aria-label="Saldo y envío de dinero">
        <div class="lc-balance-hero">
          <div class="lc-balance-label" id="lc-active-owner">Cuenta seleccionada</div>
          <div class="lc-balance-amount" id="lc-active-balance">$0.00 USD</div>
          <div class="lc-account-pills" id="lc-account-pills"></div>
        </div>

        <div class="lc-card">
          <h2 style="margin:0 0 14px;font-size:18px;">Enviar dinero</h2>
          <div id="lc-feedback-box" class="lc-banner-feedback" role="status" aria-live="polite"></div>

          <form id="lc-transfer-form">
            <div class="lc-field">
              <label for="lc-dest-select">Destinatario</label>
              <select id="lc-dest-select" class="lc-input"></select>
            </div>
            <div class="lc-field">
              <label for="lc-amount-input">Monto (USD)</label>
              <input id="lc-amount-input" class="lc-input lc-mono" type="number" min="1" step="0.01" value="125.00" />
            </div>
            <button type="submit" class="lc-btn-primary" style="width:100%;">Enviar transferencia</button>
          </form>

          <div class="lc-demo-box">
            <span style="font-size:13px;font-weight:600;color:var(--ink-muted);">Pruebas guiadas de seguridad financiera</span>
            <div class="lc-demo-row">
              <button type="button" class="lc-btn-outline" id="lc-double-click-btn">Probar doble clic (mismo pago)</button>
              <button type="button" class="lc-btn-warn" id="lc-net-fail-btn">Simular fallo de red</button>
            </div>
          </div>
        </div>
      </section>

      <section class="lc-card" aria-label="Movimientos recientes">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2 style="margin:0;font-size:18px;">Movimientos recientes</h2>
          <span class="lc-mono" id="lc-balance-integrity" style="font-size:12.5px;color:var(--emerald-cta);">Descuadre: $0.00</span>
        </div>
        <div class="lc-tx-list" id="lc-tx-list"></div>
      </section>
    </main>

    <!-- Layer 2 Architecture Drawer -->
    <div class="lc-backdrop" id="lc-arch-backdrop" data-open="false" role="dialog" aria-modal="true">
      <div class="lc-drawer">
        <div class="lc-drawer-head">
          <h2 style="margin:0;font-size:17px;">Motor Saga, Outbox &amp; Partida Doble</h2>
          <button type="button" class="lc-btn-outline" id="lc-arch-close">Cerrar</button>
        </div>
        <div class="lc-drawer-body" id="lc-arch-body"></div>
      </div>
    </div>

    <script>
      (function () {
        const state = {
          accounts: [],
          activeSourceId: "",
          sagas: [],
          audit: { imbalance_cents: 0, total_entries: 0 },
          outbox: [],
          dlq: [],
        };

        const els = {
          owner: document.getElementById("lc-active-owner"),
          balance: document.getElementById("lc-active-balance"),
          pills: document.getElementById("lc-account-pills"),
          dest: document.getElementById("lc-dest-select"),
          amount: document.getElementById("lc-amount-input"),
          feedback: document.getElementById("lc-feedback-box"),
          txList: document.getElementById("lc-tx-list"),
          integrity: document.getElementById("lc-balance-integrity"),
          archBackdrop: document.getElementById("lc-arch-backdrop"),
          archBody: document.getElementById("lc-arch-body"),
        };

        function el(tag, props, children) {
          const node = document.createElement(tag);
          if (props) {
            for (const [k, v] of Object.entries(props)) {
              if (k === "className") node.className = v;
              else if (k === "textContent") node.textContent = v;
              else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
              else node.setAttribute(k, String(v));
            }
          }
          if (Array.isArray(children)) {
            for (const c of children) {
              if (typeof c === "string") node.appendChild(document.createTextNode(c));
              else if (c) node.appendChild(c);
            }
          }
          return node;
        }

        function formatMoney(cents) {
          return "$" + (cents / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " USD";
        }

        function showFeedback(tone, text) {
          els.feedback.setAttribute("data-tone", tone);
          els.feedback.textContent = text;
        }

        async function loadWallet() {
          const [accRes, sagasRes, audRes, outRes, dlqRes] = await Promise.all([
            fetch("/api/v1/accounts"),
            fetch("/api/v1/sagas"),
            fetch("/api/v1/ledger/audit"),
            fetch("/api/v1/outbox"),
            fetch("/api/v1/dlq"),
          ]);
          const accData = await accRes.json();
          const sagasData = await sagasRes.json();
          const audData = await audRes.json();
          const outData = await outRes.json();
          const dlqData = await dlqRes.json();

          state.accounts = (accData.accounts || []).filter(function (a) { return a.account_id !== "ACC-ESCROW-CLEARING"; });
          state.sagas = sagasData.sagas || [];
          state.audit = audData;
          state.outbox = outData.events || outData.outbox || [];
          state.dlq = dlqData.events || dlqData.dlq || [];

          if (!state.activeSourceId && state.accounts[0]) {
            state.activeSourceId = state.accounts[0].account_id;
          }
          renderAccounts();
          renderMovements();
          renderArchitectureDrawer();
        }

        function renderAccounts() {
          const active = state.accounts.find(function (a) { return a.account_id === state.activeSourceId; }) || state.accounts[0];
          if (active) {
            els.owner.textContent = active.owner_name + " (" + active.account_id + ")";
            els.balance.textContent = formatMoney(active.balance_cents);
          }

          els.pills.replaceChildren.apply(
            els.pills,
            state.accounts.map(function (a) {
              return el("button", {
                type: "button",
                className: "lc-acc-pill",
                "data-active": a.account_id === state.activeSourceId ? "true" : "false",
                textContent: a.owner_name.split(" ")[0] + " · " + formatMoney(a.balance_cents),
                onClick: function () {
                  state.activeSourceId = a.account_id;
                  renderAccounts();
                },
              });
            }),
          );

          const prevDest = els.dest.value;
          const destOptions = state.accounts
            .filter(function (a) { return a.account_id !== state.activeSourceId; })
            .map(function (a) {
              return el("option", { value: a.account_id, textContent: a.owner_name + " (" + a.account_id + ")" });
            });
          els.dest.replaceChildren.apply(els.dest, destOptions);
          if (prevDest && prevDest !== state.activeSourceId) {
            els.dest.value = prevDest;
          }
        }

        function renderMovements() {
          els.integrity.textContent = "Descuadre global: " + formatMoney(state.audit.imbalance_cents || 0);
          if (state.sagas.length === 0) {
            els.txList.replaceChildren(
              el("div", { className: "lc-tx-item" }, [
                el("span", { style: "color:var(--ink-muted);", textContent: "Sin movimientos aún. Envía dinero o prueba doble clic para ver el registro." }),
              ]),
            );
            return;
          }

          const nodes = state.sagas.slice(0, 12).map(function (s) {
            const isOk = s.status === "SETTLED";
            return el("div", { className: "lc-tx-item" }, [
              el("div", {}, [
                el("div", { style: "font-weight:600;font-size:14px;", textContent: s.source_account_id + " -> " + s.destination_account_id }),
                el("div", { className: "lc-mono", style: "font-size:12px;color:var(--ink-muted);", textContent: s.saga_id }),
              ]),
              el("div", { style: "text-align:right;" }, [
                el("div", { className: "lc-mono", style: "font-weight:600;", textContent: formatMoney(s.amount_cents) }),
                el("span", {
                  className: isOk ? "lc-badge-ok" : "lc-badge-rev",
                  textContent: isOk ? "Completada" : "Revertida automáticamente",
                }),
              ]),
            ]);
          });
          els.txList.replaceChildren.apply(els.txList, nodes);
        }

        async function executeTransfer(amountCents, idemKey, simulateFail) {
          const destId = els.dest.value;
          if (!state.activeSourceId || !destId) return null;
          const resp = await fetch("/api/v1/transfers", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Idempotency-Key": idemKey,
            },
            body: JSON.stringify({
              source_account_id: state.activeSourceId,
              destination_account_id: destId,
              amount_cents: amountCents,
              currency: "USD",
              idempotency_key: idemKey,
              simulate_settlement_failure: simulateFail,
            }),
          });
          return { status: resp.status, body: await resp.json() };
        }

        document.getElementById("lc-transfer-form").addEventListener("submit", async function (e) {
          e.preventDefault();
          const cents = Math.round(Number(els.amount.value || 0) * 100);
          if (!Number.isFinite(cents) || cents <= 0) {
            showFeedback("warn", "Ingresa un monto mayor a cero.");
            return;
          }
          const key = "pay-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
          const res = await executeTransfer(cents, key, false);
          if (res && res.status < 300) {
            showFeedback("ok", "Transferencia enviada por " + formatMoney(cents) + " con saldo verificado.");
          } else {
            showFeedback("warn", (res && res.body && res.body.message) || "No se pudo completar la transferencia.");
          }
          await loadWallet();
        });

        document.getElementById("lc-double-click-btn").addEventListener("click", async function () {
          const key = "dbl-" + Date.now();
          const first = await executeTransfer(5000, key, false);
          const second = await executeTransfer(5000, key, false);
          if (first && second && second.body && second.body.idempotent_replay) {
            showFeedback("ok", "Protección anti-doble cobro verificada: se enviaron 2 clics idénticos ($50.00) y solo se descontó una vez (huella SHA-256).");
          } else {
            showFeedback("warn", "No se pudo simular el reintento en este momento.");
          }
          await loadWallet();
        });

        document.getElementById("lc-net-fail-btn").addEventListener("click", async function () {
          const key = "fail-" + Date.now();
          const res = await executeTransfer(7500, key, true);
          if (res && res.body && res.body.saga && res.body.saga.status === "COMPENSATED") {
            showFeedback("warn", "El banco receptor falló: la transferencia de $75.00 se revirtió automáticamente y tu saldo quedó intacto.");
          }
          await loadWallet();
        });

        function renderArchitectureDrawer() {
          els.archBody.replaceChildren(
            el("div", { className: "lc-tx-item" }, [
              el("span", { textContent: "Balance Zero-Sum Global" }),
              el("strong", { className: "lc-mono", style: "color:var(--emerald-cta);", textContent: "Imbalance: " + formatMoney(state.audit.imbalance_cents || 0) + " (" + (state.audit.total_entries || 0) + " asientos)" }),
            ]),
            el("div", { className: "lc-tx-item" }, [
              el("span", { textContent: "Transactional Outbox / DLQ" }),
              el("span", { className: "lc-mono", textContent: state.outbox.length + " eventos outbox · " + state.dlq.length + " DLQ" }),
            ]),
            el("p", { style: "margin:0;font-size:13.5px;color:var(--ink-muted);", textContent: "Arquitectura Java 21 / Spring Boot 3 Blueprint + motor Python ACID: cada envío escribe asientos de partida doble y eventos outbox en la misma transacción, con llaves Idempotency-Key SHA-256 y compensación Saga." }),
            el("button", {
              type: "button",
              className: "lc-btn-primary",
              textContent: "Despachar eventos Outbox pendientes",
              onClick: async function () {
                await fetch("/api/v1/outbox/relay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ limit: 50 }) });
                await loadWallet();
              },
            }),
          );
        }

        document.getElementById("lc-arch-btn").addEventListener("click", function () { renderArchitectureDrawer(); els.archBackdrop.setAttribute("data-open", "true"); });
        document.getElementById("lc-arch-close").addEventListener("click", function () { els.archBackdrop.setAttribute("data-open", "false"); });
        window.addEventListener("keydown", function (e) { if (e.key === "Escape") els.archBackdrop.setAttribute("data-open", "false"); });

        loadWallet();
      })();
    </script>
  </body>
</html>
