services:
  ledgercore-postgres-dev:
    image: postgres:16-alpine
    container_name: ledgercore-postgres-dev
    ports:
      - "5441:5432"
    environment:
      POSTGRES_USER: ledger_dev
      POSTGRES_PASSWORD: ledger_dev_local
      POSTGRES_DB: ledgercore_dev
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_dev -d ledgercore_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  ledgercore-redis-dev:
    image: redis:7-alpine
    container_name: ledgercore-redis-dev
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ledgercore-kafka-dev:
    image: apache/kafka:3.8.0
    container_name: ledgercore-kafka-dev
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://ledgercore-kafka-dev:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ledgercore-kafka-dev:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "ledgercore-dev-kraft-cluster-01"

  ledgercore-distributed-dev:
    image: python:3.12-slim
    container_name: ledgercore-distributed-dev
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8096:8096"
    env_file:
      - path: .env.development
        required: false
    environment:
      - LEDGERCORE_ENV=development
      - LEDGERCORE_PORT=8096
      - LEDGERCORE_SQLITE_PATH=/app/.data/ledgercore_dev.sqlite3
      - POSTGRES_URL=postgresql://ledger_dev:ledger_dev_local@ledgercore-postgres-dev:5432/ledgercore_dev
      - KAFKA_BOOTSTRAP_SERVERS=ledgercore-kafka-dev:9092
      - REDIS_URL=redis://ledgercore-redis-dev:6379/0
    depends_on:
      ledgercore-postgres-dev:
        condition: service_healthy
      ledgercore-redis-dev:
        condition: service_healthy
    command: python -m src.main
